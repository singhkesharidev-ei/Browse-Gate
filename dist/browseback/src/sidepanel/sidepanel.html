<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>BrowseGate</title>
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="sidepanel.css">
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="BrowseGate home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5A8.5 8.5 0 1 1 3.6 14M4 4v4h4M8 12h8m-8 4h5"/></svg></span><span>BrowseGate</span></a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
      </header>
      <div class="global-search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.5 4.5"/></svg><input id="global-search" type="search" placeholder="Search your research" aria-label="Search workspaces, sources, and notes"><kbd>Ctrl K</kbd></div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item is-active" type="button" data-view="home" aria-current="page"><span class="nav-icon">⌂</span><span>Home</span></button>
        <button class="nav-item" type="button" data-view="research"><span class="nav-icon">▤</span><span>Research</span></button>
        <button class="nav-item" type="button" data-view="notes"><span class="nav-icon">▧</span><span>Notes</span></button>
        <button class="nav-item" type="button" data-view="history"><span class="nav-icon">◷</span><span>History</span></button>
        <button class="nav-item" type="button" data-view="sessions"><span class="nav-icon">▣</span><span>Sessions</span></button>
        <button class="nav-item" type="button" data-view="reading"><span class="nav-icon">▧</span><span>Reading</span></button>
        <button class="nav-item" type="button" data-view="tools"><span class="nav-icon">⌘</span><span>Tools</span></button>
        <button class="nav-item" type="button" data-view="insights"><span class="nav-icon">⌁</span><span>Insights</span></button>
        <button class="nav-item" type="button" data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </nav>
      <main id="main-content" tabindex="-1"><div class="status-banner" id="status-banner" role="status" hidden></div><div id="content"></div></main>
      <footer class="app-footer"><span class="footer-mark" aria-hidden="true">B</span><span>BrowseGate</span><span class="footer-version">LOCAL RESEARCH</span></footer>
      <div id="dialog-root"></div>
    </div>
  </body>
</html>
